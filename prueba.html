<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualizador de Modelos 3D</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- model-viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
  <div class="demo" style="background: linear-gradient(#ffffff, #ada996); overflow-x: hidden; position: relative;">
  <span style="
    position: absolute;
    text-align: center;
    font-size: 100px;
    line-height: 100px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
    pointer-events: none;">
    MIKE<br>outdoor<br>es mi<br>RELIGION.
  </span>

  <model-viewer
    src="boxes ale 75 25.glb"
    alt="Descripción del modelo"
    ar
    camera-controls
    touch-action="pan-y"
    style="background-color: unset; width: 100%; height: 600px;"
    skybox-image="bloem_field_sunrise.jpg"
    shadow-intensity="1"
    auto-rotate>
  </model-viewer>
</div>
</body>
